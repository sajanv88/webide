packages:
  - apps/*
  - packages/*

# Exact versions only. An upgrade is one reviewed line here.
catalog:
  "@biomejs/biome": 2.6.8
  # CodeMirror, for the editor surface's language features only: the same
  # versions @nuvui/editor uses, so there's one copy of each.
  "@codemirror/autocomplete": 6.20.4
  "@codemirror/state": 6.7.6
  "@codemirror/view": 6.43.15
  "@nuvui/backgrounds": 0.1.2
  "@nuvui/editor": 0.2.0
  "@nuvui/icons": 0.1.0
  "@nuvui/react": 0.10.0
  "@tauri-apps/api": 2.12.5
  "@tauri-apps/cli": 2.12.5
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  # The terminal's renderer (no nuvui terminal exists): @repo/terminal only.
  "@xterm/xterm": 6.0.0
  jsdom: 31.0.1
  postcss: 8.5.33
  react: 19.3.1
  react-dom: 19.3.1
  sass: 1.108.2
  stylelint: 18.0.0
  stylelint-config-standard-scss: 18.0.0
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.1

# Install scripts are denied unless reviewed and listed here.
allowBuilds:
  "@parcel/watcher": false

# Supply-chain gates.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
