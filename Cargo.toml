[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Tauri 2.12's MSRV. The toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.90"
publish = false

[workspace.dependencies]
# Only what some crate uses: Cargo warns about unused workspace dependencies.

# Workspace crates
ide-core = { path = "crates/ide-core" }
ide-fs = { path = "crates/ide-fs" }
ide-git = { path = "crates/ide-git" }
ide-ipc = { path = "crates/ide-ipc" }
ide-lsp = { path = "crates/ide-lsp" }
ide-search = { path = "crates/ide-search" }
ide-terminal = { path = "crates/ide-terminal" }
ide-watcher = { path = "crates/ide-watcher" }
ide-workspace = { path = "crates/ide-workspace" }

# External (Cargo.lock holds the exact patch)
# ripgrep's own crates, for ide-search.
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
# Pseudo-terminals (ConPTY, pty), for ide-terminal: wezterm's.
portable-pty = "0.9.0"
# notify 8.2 underneath. (notify 9.0 and debouncer 0.8 were released on
# 2026-11-21, under a day before this was added; same rule as pnpm's release-age gate.)
notify-debouncer-full = { version = "0.7.0", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-dialog = "2.8.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"

# Release build tuning, as recommended by Tauri: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
