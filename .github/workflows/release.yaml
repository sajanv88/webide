# The installers for Windows, macOS and Linux.
#
# - Run by hand (Actions → Release → Run workflow), or on a pull request that
#   changes this file: the installers are kept as the run's artifacts for 14
#   days. Nothing is published.
# - On a tag vX.Y.Z (the version in tauri.conf.json): the same, then a draft
#   GitHub release with them and their SHA-256 sums. A draft is seen only by
#   the repository's writers, until one of them publishes it.
#
# The installers aren't signed yet: Windows SmartScreen and macOS Gatekeeper
# warn about them.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths: [.github/workflows/release.yaml]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            bundles: dmg
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri's Linux prerequisites, and `file` for the AppImage.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The version comes from rust-toolchain.toml; the target is this build's.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: The tag is the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but tauri.conf.json says $version"
            exit 1
          fi

      # Builds the frontend and stages the bundled resources first
      # (tauri.conf.json's beforeBuildCommand).
      - name: Build the installers
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect the installers
        shell: bash
        run: |
          mkdir out
          find "target/$TARGET/release/bundle" -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          ls -l out
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webide-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the installers
        run: gh run download "$RUN_ID" --repo "$REPO" --dir downloaded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

      - name: Draft the release
        run: |
          mkdir dist
          find downloaded -type f -exec mv {} dist/ \;
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$TAG" dist/* \
            --repo "$REPO" --draft --verify-tag \
            --title "webide $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
